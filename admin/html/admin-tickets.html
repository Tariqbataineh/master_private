<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tickets | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-tickets.css">
</head>
<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">MANAGEMENT</p>
                <h1 class="display-6 fw-bold mb-2">Tickets</h1>
                <p class="text-secondary mb-0">Manage support and accessibility issues with priority, assignment and resolution workflows.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<section class="row g-3 mb-4" id="ticketStats"></section>

<article class="content-card">
    <div class="toolbar mb-4">
        <div class="d-flex flex-wrap gap-2">
            <input type="search" class="form-control search-box" id="ticketSearch" placeholder="Search tickets...">

            <select class="form-select filter-select" id="ticketStatusFilter">
                <option value="">All Statuses</option>
                <option>Open</option>
                <option>In Progress</option>
                <option>Resolved</option>
                <option>Closed</option>
            </select>

            <select class="form-select filter-select" id="ticketPriorityFilter">
                <option value="">All Priorities</option>
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
            </select>
        </div>

        <button class="btn btn-wusool" id="addTicketButton">
            <i class="bi bi-plus-lg me-2"></i>
            Add Ticket
        </button>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Ticket</th>
                    <th>Requester</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Assigned</th>
                    <th>Updated</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="ticketsTableBody"></tbody>
        </table>
    </div>
</article>

<div class="modal fade" id="ticketModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <p class="page-label mb-1">TICKET</p>
                    <h2 class="modal-title h4 fw-bold" id="ticketModalTitle">Add Ticket</h2>
                </div>
                <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>

            <form id="ticketForm">
                <div class="modal-body">
                    <input type="hidden" id="ticketId">

                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold">Subject</label>
                            <input class="form-control" id="ticketSubject" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Priority</label>
                            <select class="form-select" id="ticketPriority">
                                <option>High</option>
                                <option selected>Medium</option>
                                <option>Low</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Status</label>
                            <select class="form-select" id="ticketStatus">
                                <option>Open</option>
                                <option>In Progress</option>
                                <option>Resolved</option>
                                <option>Closed</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Category</label>
                            <input class="form-control" id="ticketCategory" value="General">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Requester User</label>
                            <select class="form-select" id="ticketRequester">
                                <option value="">None</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Branch</label>
                            <select class="form-select" id="ticketBranch">
                                <option value="">None</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" rows="4" id="ticketDescription"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Assigned To</label>
                            <input class="form-control" id="ticketAssignedTo" placeholder="Support Admin">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Resolution</label>
                            <input class="form-control" id="ticketResolution">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-wusool" type="submit">Save Ticket</button>
                </div>
            </form>
        </div>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/data-service.js"></script>
<script src="../../assets/version-service.js"></script>
    <script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-tickets.js"></script>
    <script src="../../assets/behavior-service.js"></script>
    <script src="../../assets/behavior-runtime.js"></script>
    <script src="../../assets/feature-store.js"></script>
    <script src="../../assets/error-runtime.js"></script>
    <script src="../../assets/maintenance-runtime.js"></script>
</body>
</html>
