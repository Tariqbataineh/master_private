<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rules Engine | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-rules-engine.css">
</head>

<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon">
            <i class="bi bi-universal-access"></i>
        </span>

        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">AUTOMATION</p>
                <h1 class="display-6 fw-bold mb-2">Rules Engine</h1>
                <p class="text-secondary mb-0">Build IF / THEN platform logic without hardcoding conditions.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<div class="row g-4">
    <div class="col-12 col-xl-5">
        <article class="content-card">
            <p class="page-label mb-1">NO-CODE RULE</p>
            <h2 class="h4 fw-bold mb-4">IF / THEN Builder</h2>

            <label class="form-label fw-semibold">Rule Name</label>
            <input class="form-control mb-3" id="ruleName" value="New Rule">

            <label class="form-label fw-semibold">Entity</label>
            <select class="form-select mb-3" id="ruleEntity">
                <option>Branch</option>
                <option>Organization</option>
                <option>Ticket</option>
            </select>

            <label class="form-label fw-semibold">Field</label>
            <select class="form-select mb-3" id="ruleField">
                <option value="accessibilityScore">Accessibility Score</option>
                <option value="status">Status</option>
                <option value="priority">Priority</option>
                <option value="city">City</option>
            </select>

            <label class="form-label fw-semibold">Operator</label>
            <select class="form-select mb-3" id="ruleOperator">
                <option value="equals">Equals</option>
                <option value="notEquals">Not Equals</option>
                <option value="lessThan">Less Than</option>
                <option value="greaterThan">Greater Than</option>
                <option value="contains">Contains</option>
            </select>

            <label class="form-label fw-semibold">Value</label>
            <input class="form-control mb-3" id="ruleValue">

            <label class="form-label fw-semibold">Action</label>
            <select class="form-select mb-3" id="ruleAction">
                <option value="setStatus">Set Status</option>
                <option value="notifyAdmin">Notify Admin</option>
            </select>

            <label class="form-label fw-semibold">Action Value</label>
            <input
                class="form-control mb-4"
                id="ruleActionValue"
                placeholder="needs review / notification text"
            >

            <button class="btn btn-wusool w-100" id="addRuleButton">
                Add Rule
            </button>
        </article>
    </div>

    <div class="col-12 col-xl-7">
        <article class="content-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <p class="page-label mb-1">ACTIVE RULES</p>
                    <h2 class="h4 fw-bold mb-0">Business Logic</h2>
                </div>

                <button class="btn btn-outline-primary" id="runRulesButton">
                    Run Rules Now
                </button>
            </div>

            <div id="rulesList"></div>
        </article>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/data-service.js"></script>
<script src="../../assets/version-service.js"></script>
<script src="../../assets/behavior-service.js"></script>
<script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-rules-engine.js"></script>
    <script src="../../assets/feature-store.js"></script>
    <script src="../../assets/error-runtime.js"></script>
    <script src="../../assets/maintenance-runtime.js"></script>
</body>
</html>
