<body data-admin-polish="branches">

<header
    class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2"
>
    <a
        href="./admin-dashboard.html"
        class="brand-link d-flex align-items-center gap-2 text-decoration-none"
    >
        <span class="brand-icon">
            <i class="bi bi-universal-access"></i>
        </span>

        <span class="fw-bold fs-4">
            Wusool
        </span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">

    <div id="adminSidebarContainer"></div>

    <main class="main-content">

        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">

                <div
                    class="d-flex flex-column flex-xl-row justify-content-between align-items-xl-end gap-3"
                >
                    <div>
                        <p class="page-label mb-2">
                            MANAGEMENT
                        </p>

                        <h1 class="display-6 fw-bold mb-2">
                            Branches
                        </h1>

                        <p class="text-secondary mb-0">
                            Add draft branches for organizations to complete working hours, facilities, photos and AI analysis.
                        </p>
                    </div>

                    <button
                        type="button"
                        class="btn btn-wusool"
                        id="addBranchButton"
                    >
                        <i class="bi bi-plus-lg me-2"></i>
                        Add Branch
                    </button>
                </div>

            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">

            <section
                class="row g-3 mb-4"
                id="branchStats"
            ></section>

            <article class="content-card">

                <div class="toolbar mb-4">

                    <div class="d-flex flex-wrap gap-2">

                        <input
                            type="search"
                            class="form-control search-box"
                            id="branchSearch"
                            placeholder="Search branches..."
                        >

                        <select
                            class="form-select filter-select"
                            id="branchOrganizationFilter"
                        >
                            <option value="">
                                All Organizations
                            </option>
                        </select>

                        <select
                            class="form-select filter-select"
                            id="branchStatusFilter"
                        >
                            <option value="">
                                All Statuses
                            </option>

                            <option value="approved">
                                Approved
                            </option>

                            <option value="pending">
                                Pending
                            </option>

                            <option value="rejected">
                                Rejected
                            </option>

                            <option value="suspended">
                                Suspended
                            </option>

                            <option value="needs review">
                                Needs Review
                            </option>
                        </select>

                    </div>

                    <span
                        class="text-secondary"
                        id="branchCount"
                    ></span>

                </div>

                <div class="table-responsive">
                    <table class="table align-middle">

                        <thead>
                            <tr>
                                <th>Branch</th>
                                <th>Organization</th>
                                <th>City</th>
                                <th>Score</th>
                                <th>Status</th>
                                <th>Updated</th>
                                <th class="text-end">
                                    Actions
                                </th>
                            </tr>
                        </thead>

                        <tbody id="branchesTableBody"></tbody>

                    </table>
                </div>

            </article>

        </div>

    </main>
</div>


<div
    class="modal fade"
    id="branchModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <p class="page-label mb-1">
                        BRANCH
                    </p>

                    <h2
                        class="modal-title h4 fw-bold"
                        id="branchModalTitle"
                    >
                        Add Branch
                    </h2>
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>
            </div>

            <form id="branchForm">

                <div class="modal-body">

                    <input
                        type="hidden"
                        id="branchId"
                    >

                    <div class="row g-3">

                        <div class="col-12 col-md-7">
                            <label
                                class="form-label fw-semibold"
                                for="branchName"
                            >
                                Branch Name
                            </label>

                            <input
                                class="form-control"
                                id="branchName"
                                required
                            >
                        </div>

                        <div class="col-12 col-md-5">
                            <label
                                class="form-label fw-semibold"
                                for="branchOrganization"
                            >
                                Organization
                            </label>

                            <select
                                class="form-select"
                                id="branchOrganization"
                                required
                            ></select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label
                                class="form-label fw-semibold"
                                for="branchCity"
                            >
                                City
                            </label>

                            <input
                                class="form-control"
                                id="branchCity"
                                value="Amman"
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label
                                class="form-label fw-semibold"
                                for="branchPhone"
                            >
                                Phone
                            </label>

                            <input
                                class="form-control"
                                id="branchPhone"
                            >
                        </div>

                        <div class="col-12">
                            <label
                                class="form-label fw-semibold"
                                for="branchAddress"
                            >
                                Address
                            </label>

                            <input
                                class="form-control"
                                id="branchAddress"
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label
                                class="form-label fw-semibold"
                                for="branchScore"
                            >
                                Accessibility Score
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="branchScore"
                                readonly placeholder="Awaiting AI analysis"
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label
                                class="form-label fw-semibold"
                                for="branchStatus"
                            >
                                Status
                            </label>

                            <select
                                class="form-select"
                                id="branchStatus"
                            >
<option value="draft">Draft — organization completes setup</option>
                                <option value="approved">
                                    Approved
                                </option>

                                <option value="pending">
                                    Pending
                                </option>

                                <option value="needs review">
                                    Needs Review
                                </option>

                                <option value="rejected">
                                    Rejected
                                </option>

                                <option value="suspended">
                                    Suspended
                                </option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label
                                class="form-label fw-semibold"
                                for="branchNotes"
                            >
                                Admin Notes
                            </label>

                            <textarea
                                class="form-control"
                                rows="4"
                                id="branchNotes"
                            ></textarea>
                        </div>

                    </div>

                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-wusool"
                    >
                        Save Branch
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>


<div
    class="modal fade"
    id="branchDetailsModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <p class="page-label mb-1">
                        BRANCH 360° VIEW
                    </p>

                    <h2
                        class="modal-title h4 fw-bold"
                        id="branchDetailsTitle"
                    ></h2>
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>
            </div>

            <div
                class="modal-body"
                id="branchDetailsContent"
            ></div>

        </div>
    </div>
</div>
