<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subscriptions | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-subscriptions.css">
</head>
<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">MANAGEMENT</p>
                <h1 class="display-6 fw-bold mb-2">Subscriptions</h1>
                <p class="text-secondary mb-0">Control plans, branch limits, billing periods, status and organization subscription history.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<section class="row g-3 mb-4" id="subscriptionStats"></section>

<article class="content-card">
    <div class="toolbar mb-4">
        <div class="d-flex flex-wrap gap-2">
            <input
                type="search"
                class="form-control search-box"
                id="subscriptionSearch"
                placeholder="Search plans or billing..."
            >

            <select class="form-select filter-select" id="subscriptionStatusFilter">
                <option value="">All Statuses</option>
                <option>Active</option>
                <option>Paused</option>
                <option>Cancelled</option>
                <option>Expired</option>
            </select>
        </div>

        <button class="btn btn-wusool" id="addSubscriptionButton">
            <i class="bi bi-plus-lg me-2"></i>
            Add Subscription
        </button>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Organization</th>
                    <th>Plan</th>
                    <th>Status</th>
                    <th>Branch Limit</th>
                    <th>Billing</th>
                    <th>End Date</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="subscriptionsTableBody"></tbody>
        </table>
    </div>
</article>

<div class="modal fade" id="subscriptionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <p class="page-label mb-1">SUBSCRIPTION</p>
                    <h2 class="modal-title h4 fw-bold" id="subscriptionModalTitle">
                        Add Subscription
                    </h2>
                </div>

                <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>

            <form id="subscriptionForm">
                <div class="modal-body">
                    <input type="hidden" id="subscriptionId">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Organization</label>
                            <select class="form-select" id="subscriptionOrganization" required></select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Plan</label>
                            <select class="form-select" id="subscriptionPlan">
                                <option>Basic</option>
                                <option>Standard</option>
                                <option>Enterprise</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Status</label>
                            <select class="form-select" id="subscriptionStatus">
                                <option>Active</option>
                                <option>Paused</option>
                                <option>Cancelled</option>
                                <option>Expired</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Branch Limit</label>
                            <input type="number" min="1" class="form-control" id="subscriptionBranchLimit" value="5">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Price</label>
                            <input type="number" min="0" class="form-control" id="subscriptionPrice" value="0">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Billing Cycle</label>
                            <select class="form-select" id="subscriptionBilling">
                                <option>Monthly</option>
                                <option>Annual</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Start Date</label>
                            <input type="date" class="form-control" id="subscriptionStart">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold">End Date</label>
                            <input type="date" class="form-control" id="subscriptionEnd">
                        </div>

                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="subscriptionAutoRenew" checked>
                                <label class="form-check-label" for="subscriptionAutoRenew">
                                    Auto Renew
                                </label>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Notes</label>
                            <textarea class="form-control" rows="3" id="subscriptionNotes"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button class="btn btn-wusool" type="submit">
                        Save Subscription
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/data-service.js"></script>
<script src="../../assets/version-service.js"></script>
    <script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-subscriptions.js"></script>
    <script src="../../assets/behavior-service.js"></script>
    <script src="../../assets/behavior-runtime.js"></script>
    <script src="../../assets/feature-store.js"></script>
    <script src="../../assets/error-runtime.js"></script>
    <script src="../../assets/maintenance-runtime.js"></script>
</body>
</html>
