<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Admin Copilot | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-ai-copilot.css">
</head>
<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">AI ASSISTANT</p>
                <h1 class="display-6 fw-bold mb-2">AI Admin Copilot</h1>
                <p class="text-secondary mb-0">Query current platform data with a working frontend command assistant.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<div class="row g-4">
    <div class="col-12 col-xl-8">
        <article class="content-card">
            <p class="page-label mb-1">ADMIN COPILOT</p>
            <h2 class="h4 fw-bold mb-4">Ask Wusool</h2>

            <div class="border rounded-4 p-3 mb-3 bg-light" id="copilotConversation" style="min-height:340px;"></div>

            <div class="input-group">
                <input
                    class="form-control"
                    id="copilotInput"
                    placeholder="Try: branches below 60, open tickets, pending organizations..."
                >
                <button class="btn btn-wusool" id="copilotSend">Ask</button>
            </div>
        </article>
    </div>

    <div class="col-12 col-xl-4">
        <article class="content-card">
            <p class="page-label mb-1">EXAMPLES</p>
            <h2 class="h5 fw-bold mb-3">Supported Demo Questions</h2>

            <div class="d-grid gap-2">
                <button class="btn btn-outline-secondary text-start" data-question="branches below 60">Branches below 60</button>
                <button class="btn btn-outline-secondary text-start" data-question="open tickets">Open tickets</button>
                <button class="btn btn-outline-secondary text-start" data-question="pending organizations">Pending organizations</button>
                <button class="btn btn-outline-secondary text-start" data-question="flagged reviews">Flagged reviews</button>
                <button class="btn btn-outline-secondary text-start" data-question="platform summary">Platform summary</button>
            </div>
        </article>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/data-service.js"></script>
<script src="../../assets/version-service.js"></script>
<script src="../../assets/behavior-service.js"></script>
<script src="../../assets/feature-store.js"></script>
<script src="../../assets/error-runtime.js"></script>
<script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-ai-copilot.js"></script>
</body>
</html>
