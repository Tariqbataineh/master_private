<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Form Builder | Wusool</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-form-builder.css">
</head>

<body>

<header
    class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2"
>
    <a
        href="./admin-dashboard.html"
        class="brand-link d-flex align-items-center gap-2 text-decoration-none"
    >
        <span class="brand-icon">
            <i class="bi bi-universal-access"></i>
        </span>

        <span class="fw-bold fs-4">
            Wusool
        </span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">

    <div id="adminSidebarContainer"></div>

    <main class="main-content">

        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">
                    NO-CODE FORMS
                </p>

                <h1 class="display-6 fw-bold mb-2">
                    Dynamic Form Builder
                </h1>

                <p class="text-secondary mb-0">
                    Add fields to real Wusool forms without editing their HTML.
                </p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">

            <div class="row g-4">

                <div class="col-12 col-xl-4">

                    <article class="content-card">

                        <p class="page-label mb-1">
                            TARGET FORM
                        </p>

                        <label
                            class="form-label fw-semibold mt-3"
                            for="formPage"
                        >
                            Page
                        </label>

                        <select
                            class="form-select mb-4"
                            id="formPage"
                        >
                            <option value="org/html/organization-register.html">
                                Organization Registration
                            </option>

                            <option value="user/html/report-accessibility-issue.html">
                                User Accessibility Report
                            </option>

                            <option value="user/html/write-review.html">
                                User Review
                            </option>

                            <option value="visitor/html/register.html">
                                Visitor Registration
                            </option>
                        </select>

                        <hr>

                        <p class="page-label mb-1">
                            ADD FIELD
                        </p>

                        <label class="form-label fw-semibold mt-3">
                            Label
                        </label>

                        <input
                            class="form-control mb-3"
                            id="fieldLabel"
                            placeholder="Commercial Registration Number"
                        >

                        <label class="form-label fw-semibold">
                            Field Type
                        </label>

                        <select
                            class="form-select mb-3"
                            id="fieldType"
                        >
                            <option>Text</option>
                            <option>Email</option>
                            <option>Phone</option>
                            <option>Number</option>
                            <option>Select</option>
                            <option>Checkbox</option>
                            <option>Textarea</option>
                            <option>Date</option>
                            <option>File</option>
                        </select>

                        <label class="form-label fw-semibold">
                            Placeholder
                        </label>

                        <input
                            class="form-control mb-3"
                            id="fieldPlaceholder"
                        >

                        <label class="form-label fw-semibold">
                            Help Text
                        </label>

                        <input
                            class="form-control mb-3"
                            id="fieldHelpText"
                        >

                        <div
                            class="d-none"
                            id="selectOptionsGroup"
                        >
                            <label class="form-label fw-semibold">
                                Options
                            </label>

                            <input
                                class="form-control mb-3"
                                id="fieldOptions"
                                placeholder="Option A, Option B, Option C"
                            >
                        </div>

                        <div class="row g-2 mb-3">

                            <div class="col-6">
                                <label class="form-label fw-semibold">
                                    Width
                                </label>

                                <select
                                    class="form-select"
                                    id="fieldWidth"
                                >
                                    <option value="full">
                                        Full
                                    </option>

                                    <option value="half">
                                        Half
                                    </option>
                                </select>
                            </div>

                            <div class="col-6 d-flex align-items-end">
                                <div class="form-check form-switch mb-2">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="fieldRequired"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="fieldRequired"
                                    >
                                        Required
                                    </label>
                                </div>
                            </div>

                        </div>

                        <button
                            class="btn btn-wusool w-100"
                            id="addFieldButton"
                        >
                            <i class="bi bi-plus-lg me-2"></i>
                            Add Field
                        </button>

                    </article>

                </div>

                <div class="col-12 col-xl-8">

                    <article class="content-card">

                        <div
                            class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4"
                        >
                            <div>
                                <p class="page-label mb-1">
                                    FORM SCHEMA
                                </p>

                                <h2 class="h4 fw-bold mb-0">
                                    Fields
                                </h2>
                            </div>

                            <div class="d-flex gap-2">
                                <button
                                    class="btn btn-outline-secondary"
                                    id="saveFormDraft"
                                >
                                    Save Draft
                                </button>

                                <button
                                    class="btn btn-wusool"
                                    id="publishForm"
                                >
                                    Publish Form
                                </button>
                            </div>
                        </div>

                        <div id="formFieldsList"></div>

                    </article>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/version-service.js"></script>
<script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-form-builder.js"></script>

    <script src="../../assets/behavior-service.js"></script>
    <script src="../../assets/behavior-runtime.js"></script>
    <script src="../../assets/feature-store.js"></script>
    <script src="../../assets/error-runtime.js"></script>
    <script src="../../assets/maintenance-runtime.js"></script>
</body>
</html>
