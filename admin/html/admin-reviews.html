<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reviews | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-reviews.css">
</head>
<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">MANAGEMENT</p>
                <h1 class="display-6 fw-bold mb-2">Reviews</h1>
                <p class="text-secondary mb-0">Moderate ratings and comments, flag content, change visibility and keep audit history.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<section class="row g-3 mb-4" id="reviewStats"></section>

<article class="content-card">
    <div class="toolbar mb-4">
        <div class="d-flex flex-wrap gap-2">
            <input type="search" class="form-control search-box" id="reviewSearch" placeholder="Search reviews...">

            <select class="form-select filter-select" id="reviewStatusFilter">
                <option value="">All Statuses</option>
                <option>Visible</option>
                <option>Hidden</option>
                <option>Pending</option>
            </select>

            <select class="form-select filter-select" id="reviewFlagFilter">
                <option value="">All Reviews</option>
                <option value="flagged">Flagged Only</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Review</th>
                    <th>User</th>
                    <th>Branch</th>
                    <th>Rating</th>
                    <th>Status</th>
                    <th>Flagged</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="reviewsTableBody"></tbody>
        </table>
    </div>
</article>

<div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <p class="page-label mb-1">REVIEW MODERATION</p>
                    <h2 class="modal-title h4 fw-bold" id="reviewModalTitle"></h2>
                </div>

                <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="reviewId">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Comment</label>
                    <textarea class="form-control" rows="5" id="reviewComment"></textarea>
                </div>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Rating</label>
                        <input type="number" min="1" max="5" class="form-control" id="reviewRating">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Status</label>
                        <select class="form-select" id="reviewStatus">
                            <option>Visible</option>
                            <option>Hidden</option>
                            <option>Pending</option>
                        </select>
                    </div>

                    <div class="col-md-4 d-flex align-items-end">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="reviewFlagged">
                            <label class="form-check-label" for="reviewFlagged">Flagged</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Admin Note</label>
                        <textarea class="form-control" rows="3" id="reviewAdminNote"></textarea>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-wusool" type="button" id="saveReviewButton">Save Review</button>
            </div>
        </div>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/data-service.js"></script>
<script src="../../assets/version-service.js"></script>
    <script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-reviews.js"></script>
    <script src="../../assets/behavior-service.js"></script>
    <script src="../../assets/behavior-runtime.js"></script>
    <script src="../../assets/feature-store.js"></script>
    <script src="../../assets/error-runtime.js"></script>
    <script src="../../assets/maintenance-runtime.js"></script>
</body>
</html>
