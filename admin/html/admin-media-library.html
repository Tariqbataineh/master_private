<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Library | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-media-library.css">
</head>
<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">PLATFORM BUILDER</p>
                <h1 class="display-6 fw-bold mb-2">Media Library</h1>
                <p class="text-secondary mb-0">Upload, replace and reuse images across the entire Wusool platform. Reusable assets uploaded here can be selected directly inside the Visual Page Builder.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<article class="content-card p-4">
    <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 mb-4">
        <div>
            <p class="page-label mb-1">ASSET MANAGEMENT</p>
            <h2 class="h4 fw-bold mb-0">Platform Media</h2>
        </div>

        <div class="d-flex flex-column flex-sm-row gap-2">
            <input
                type="search"
                class="form-control"
                id="mediaSearch"
                placeholder="Search media..."
            >

            <label class="btn btn-wusool mb-0">
                <i class="bi bi-cloud-arrow-up me-2"></i>
                Upload
                <input type="file" id="mediaUpload" accept="image/*" hidden multiple>
            </label>
        </div>
    </div>

    <div class="row g-3" id="mediaGrid"></div>
</article>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-media-library.js"></script>
    <script src="../../assets/data-service.js"></script>
    <script src="../../assets/version-service.js"></script>
    <script src="../../assets/behavior-service.js"></script>
    <script src="../../assets/behavior-runtime.js"></script>
    <script src="../../assets/feature-store.js"></script>
    <script src="../../assets/error-runtime.js"></script>
    <script src="../../assets/maintenance-runtime.js"></script>
</body>
</html>
