<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon">
            <i class="bi bi-universal-access"></i>
        </span>

        <span class="fw-bold fs-4">
            Wusool
        </span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">

    <div id="adminSidebarContainer"></div>

    <main class="main-content">

        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">
                    ACCESSIBILITY ENGINE
                </p>

                <h1 class="display-6 fw-bold mb-2">
                    Requirements Builder
                </h1>

                <p class="text-secondary mb-0">
                    Change the real organization accessibility checklist without editing branch-accessibility.html.
                </p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">

            <div class="row g-4">

                <div class="col-12 col-xl-4">

                    <article class="content-card">

                        <p class="page-label mb-1">
                            ADD REQUIREMENT
                        </p>

                        <label class="form-label fw-semibold mt-3">
                            Requirement
                        </label>

                        <input
                            class="form-control mb-3"
                            id="requirementTitle"
                            placeholder="Accessible Service Counter"
                        >

                        <label class="form-label fw-semibold">
                            Description
                        </label>

                        <textarea
                            class="form-control mb-3"
                            rows="3"
                            id="requirementDescription"
                        ></textarea>

                        <label class="form-label fw-semibold">
                            Category
                        </label>

                        <select
                            class="form-select mb-3"
                            id="requirementCategory"
                        >
                            <option>Entrance</option>
                            <option>Parking</option>
                            <option>Interior</option>
                            <option>Restroom</option>
                            <option>Navigation</option>
                            <option>Service</option>
                        </select>

                        <div class="row g-2">

                            <div class="col-6">
                                <label class="form-label fw-semibold">
                                    Weight
                                </label>

                                <input
                                    type="number"
                                    min="1"
                                    max="10"
                                    class="form-control"
                                    id="requirementWeight"
                                    value="5"
                                >
                            </div>

                            <div class="col-6">
                                <label class="form-label fw-semibold">
                                    Icon
                                </label>

                                <input
                                    class="form-control"
                                    id="requirementIcon"
                                    value="bi-universal-access"
                                >
                            </div>

                        </div>

                        <div class="form-check form-switch my-3">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="requirementRequired"
                            >

                            <label
                                class="form-check-label"
                                for="requirementRequired"
                            >
                                Required
                            </label>
                        </div>

                        <button
                            class="btn btn-wusool w-100"
                            id="addRequirement"
                        >
                            Add Requirement
                        </button>

                    </article>

                </div>

                <div class="col-12 col-xl-8">

                    <article class="content-card">

                        <div
                            class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-4"
                        >
                            <div>
                                <p class="page-label mb-1">
                                    LIVE CHECKLIST
                                </p>

                                <h2 class="h4 fw-bold mb-0">
                                    Requirements
                                </h2>
                            </div>

                            <div class="d-flex gap-2">
                                <button
                                    class="btn btn-outline-secondary"
                                    id="resetRequirements"
                                >
                                    Reset Defaults
                                </button>

                                <button
                                    class="btn btn-wusool"
                                    id="publishRequirements"
                                >
                                    Publish Checklist
                                </button>
                            </div>
                        </div>

                        <div id="requirementsList"></div>

                    </article>

                </div>

            </div>

        </div>

    </main>
</div>
