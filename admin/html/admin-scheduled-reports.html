<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Reports | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-scheduled-reports.css">
</head>
<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">AUTOMATION</p>
                <h1 class="display-6 fw-bold mb-2">Scheduled Reports</h1>
                <p class="text-secondary mb-0">Configure recurring report definitions for backend delivery later.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<div class="row g-4">
    <div class="col-12 col-xl-4">
        <article class="content-card">
            <p class="page-label mb-1">NEW SCHEDULE</p>
            <h2 class="h4 fw-bold mb-4">Scheduled Report</h2>

            <label class="form-label fw-semibold">Report</label>
            <select class="form-select mb-3" id="scheduleReport">
                <option>Accessibility Summary</option>
                <option>Organization Summary</option>
                <option>Ticket Summary</option>
                <option>Subscription Summary</option>
            </select>

            <label class="form-label fw-semibold">Frequency</label>
            <select class="form-select mb-3" id="scheduleFrequency">
                <option>Daily</option>
                <option>Weekly</option>
                <option>Monthly</option>
            </select>

            <label class="form-label fw-semibold">Recipient</label>
            <input type="email" class="form-control mb-3" id="scheduleRecipient">

            <button class="btn btn-wusool w-100" id="addSchedule">Add Schedule</button>
        </article>
    </div>

    <div class="col-12 col-xl-8">
        <article class="content-card">
            <p class="page-label mb-1">SCHEDULES</p>
            <h2 class="h4 fw-bold mb-4">Recurring Reports</h2>
            <div id="schedulesList"></div>
        </article>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/data-service.js"></script>
<script src="../../assets/version-service.js"></script>
<script src="../../assets/behavior-service.js"></script>
<script src="../../assets/feature-store.js"></script>
<script src="../../assets/error-runtime.js"></script>
<script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-scheduled-reports.js"></script>
</body>
</html>
