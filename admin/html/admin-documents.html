<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Center | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-documents.css">
</head>
<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">DOCUMENT MANAGEMENT</p>
                <h1 class="display-6 fw-bold mb-2">Document Center</h1>
                <p class="text-secondary mb-0">Manage organization documents, approvals and expiry dates.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<div class="row g-4">
    <div class="col-12 col-xl-4">
        <article class="content-card">
            <p class="page-label mb-1">ADD DOCUMENT</p>
            <h2 class="h4 fw-bold mb-4">Organization Document</h2>

            <label class="form-label fw-semibold">Organization</label>
            <select class="form-select mb-3" id="documentOrganization"></select>

            <label class="form-label fw-semibold">Document Type</label>
            <select class="form-select mb-3" id="documentType">
                <option>Commercial Registration</option>
                <option>Government Approval</option>
                <option>Accessibility Certificate</option>
                <option>Other</option>
            </select>

            <label class="form-label fw-semibold">File Name</label>
            <input class="form-control mb-3" id="documentName" placeholder="registration.pdf">

            <label class="form-label fw-semibold">Expiry Date</label>
            <input type="date" class="form-control mb-3" id="documentExpiry">

            <button class="btn btn-wusool w-100" id="addDocument">Add Document</button>
        </article>
    </div>

    <div class="col-12 col-xl-8">
        <article class="content-card">
            <div class="toolbar mb-4">
                <div>
                    <p class="page-label mb-1">DOCUMENT CENTER</p>
                    <h2 class="h4 fw-bold mb-0">Documents</h2>
                </div>
                <input class="form-control search-box" id="documentSearch" placeholder="Search documents...">
            </div>
            <div id="documentsList"></div>
        </article>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/data-service.js"></script>
<script src="../../assets/version-service.js"></script>
<script src="../../assets/behavior-service.js"></script>
<script src="../../assets/feature-store.js"></script>
<script src="../../assets/error-runtime.js"></script>
<script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-documents.js"></script>
</body>
</html>
