<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-settings.css">
</head>
<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">SYSTEM CONTROL</p>
                <h1 class="display-6 fw-bold mb-2">System Settings</h1>
                <p class="text-secondary mb-0">Manage global platform identity and operational defaults.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<div class="row g-4">
    <div class="col-12 col-xl-7">
        <article class="content-card">
            <p class="page-label mb-1">GLOBAL SETTINGS</p>
            <h2 class="h4 fw-bold mb-4">Platform Identity</h2>

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Platform Name</label>
                    <input class="form-control" id="platformName">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Support Email</label>
                    <input type="email" class="form-control" id="supportEmail">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Support Phone</label>
                    <input class="form-control" id="supportPhone">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Default Language</label>
                    <select class="form-select" id="defaultLanguage">
                        <option value="en">English</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Max Upload MB</label>
                    <input type="number" class="form-control" id="maxUploadMb" min="1">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Default City</label>
                    <input class="form-control" id="defaultCity">
                </div>
            </div>

            <button class="btn btn-wusool mt-4" id="saveSettings">Save Settings</button>
        </article>
    </div>

    <div class="col-12 col-xl-5">
        <article class="content-card">
            <p class="page-label mb-1">PLATFORM BEHAVIOR</p>
            <h2 class="h4 fw-bold mb-4">Defaults</h2>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="requireBranchApproval">
                <label class="form-check-label" for="requireBranchApproval">Require branch approval</label>
            </div>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="enableAiByDefault">
                <label class="form-check-label" for="enableAiByDefault">Enable AI by default</label>
            </div>

            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="allowPublicReviews">
                <label class="form-check-label" for="allowPublicReviews">Allow public reviews</label>
            </div>
        </article>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/data-service.js"></script>
<script src="../../assets/version-service.js"></script>
<script src="../../assets/behavior-service.js"></script>
<script src="../../assets/feature-store.js"></script>
<script src="../../assets/error-runtime.js"></script>
<script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-settings.js"></script>
</body>
</html>
