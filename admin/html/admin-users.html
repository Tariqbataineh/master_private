<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-users.css">
</head>
<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">MANAGEMENT</p>
                <h1 class="display-6 fw-bold mb-2">Users</h1>
                <p class="text-secondary mb-0">Manage user accounts, accessibility preferences, status and 360° activity.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<section class="row g-3 mb-4" id="userStats"></section>

<article class="content-card">
    <div class="toolbar mb-4">
        <div class="d-flex flex-wrap gap-2">
            <input
                type="search"
                class="form-control search-box"
                id="userSearch"
                placeholder="Search users..."
            >

            <select class="form-select filter-select" id="userStatusFilter">
                <option value="">All Statuses</option>
                <option value="active">Active</option>
                <option value="suspended">Suspended</option>
                <option value="blocked">Blocked</option>
            </select>
        </div>

        <button class="btn btn-wusool" id="addUserButton">
            <i class="bi bi-person-plus me-2"></i>
            Add User
        </button>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>User</th>
                    <th>City</th>
                    <th>Status</th>
                    <th>Preferences</th>
                    <th>Tickets</th>
                    <th>Reviews</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>
    </div>
</article>

<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <p class="page-label mb-1">USER</p>
                    <h2 class="modal-title h4 fw-bold" id="userModalTitle">Add User</h2>
                </div>
                <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>

            <form id="userForm">
                <div class="modal-body">
                    <input type="hidden" id="userId">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input class="form-control" id="userName" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="userEmail">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phone</label>
                            <input class="form-control" id="userPhone">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">City</label>
                            <input class="form-control" id="userCity" value="Amman">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Role</label>
                            <select class="form-select" id="userRole">
                                <option>User</option>
                                <option>Reviewer</option>
                                <option>Support Admin</option>
                                <option>Content Manager</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Status</label>
                            <select class="form-select" id="userStatus">
                                <option value="active">Active</option>
                                <option value="suspended">Suspended</option>
                                <option value="blocked">Blocked</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">
                                Accessibility Preferences
                            </label>

                            <input
                                class="form-control"
                                id="userPreferences"
                                placeholder="Wheelchair Access, Elevator, Accessible Parking"
                            >
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Admin Notes</label>
                            <textarea class="form-control" rows="4" id="userNotes"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button class="btn btn-wusool" type="submit">
                        Save User
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="userDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <p class="page-label mb-1">USER 360° VIEW</p>
                    <h2 class="modal-title h4 fw-bold" id="userDetailsTitle"></h2>
                </div>

                <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body" id="userDetailsContent"></div>
        </div>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/data-service.js"></script>
<script src="../../assets/version-service.js"></script>
    <script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-users.js"></script>
    <script src="../../assets/behavior-service.js"></script>
    <script src="../../assets/behavior-runtime.js"></script>
    <script src="../../assets/feature-store.js"></script>
    <script src="../../assets/error-runtime.js"></script>
    <script src="../../assets/maintenance-runtime.js"></script>
</body>
</html>
