<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Manager | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-navigation-manager.css">
</head>
<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button class="btn btn-outline-light" type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar">
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">NO-CODE NAVIGATION</p>
                <h1 class="display-6 fw-bold mb-2">Navigation Manager</h1>
                <p class="text-secondary mb-0">Rename, show, hide and manage User, Organization and public menus without editing code.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<div class="row g-4">
    <div class="col-12 col-xl-7">
        <article class="content-card">
            <div class="toolbar mb-4">
                <div>
                    <p class="page-label mb-1">MENU ITEMS</p>
                    <h2 class="h4 fw-bold mb-0">User Navigation</h2>
                </div>

                <button class="btn btn-wusool" id="addNavItem">
                    <i class="bi bi-plus-lg me-2"></i>Add Item
                </button>
            </div>

            <div id="navigationList"></div>
        </article>
    </div>

    <div class="col-12 col-xl-5">
        <article class="content-card">
            <p class="page-label mb-1">SETTINGS</p>
            <h2 class="h4 fw-bold mb-4">Navigation Behavior</h2>

            <label class="form-label fw-semibold">Portal</label>
            <select class="form-select mb-3">
                <option>User Portal</option>
                <option>Organization Portal</option>
                <option>Public Website</option>
            </select>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="mobileLabels" checked>
                <label class="form-check-label" for="mobileLabels">Show labels on mobile</label>
            </div>

            <button class="btn btn-wusool w-100" id="saveNavigation">
                Save Navigation
            </button>
        </article>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/admin-api.js"></script>
    <script src="../../assets/data-service.js"></script>
    <script src="../../assets/version-service.js"></script>
    <script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-navigation-manager.js"></script>
    <script src="../../assets/behavior-service.js"></script>
    <script src="../../assets/behavior-runtime.js"></script>
    <script src="../../assets/feature-store.js"></script>
    <script src="../../assets/error-runtime.js"></script>
    <script src="../../assets/maintenance-runtime.js"></script>
</body>
</html>
