<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">

    <link rel="stylesheet" href="../css/admin-reports.css">

<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon"><i class="bi bi-universal-access"></i></span>
        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">

                <h1 class="display-6 fw-bold mb-2">Reports & Analytics</h1>
                <p class="text-secondary mb-0">View live operational summaries from the unified data layer.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<section class="row g-3 mb-4" id="reportStats"></section>

<div class="row g-4">
    <div class="col-12 col-xl-6">
        <article class="content-card">
            <p class="page-label mb-1">BRANCH STATUS</p>
            <h2 class="h4 fw-bold mb-4">Branch Distribution</h2>
            <div id="branchReport"></div>
        </article>
    </div>

    <div class="col-12 col-xl-6">
        <article class="content-card">
            <p class="page-label mb-1">SUPPORT</p>
            <h2 class="h4 fw-bold mb-4">Ticket Distribution</h2>
            <div id="ticketReport"></div>
        </article>
    </div>
</div>

        </div>
    </main>
</div>
