<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Announcements | Wusool</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-sidebar.css">
    <link rel="stylesheet" href="../css/admin-common.css">
    <link rel="stylesheet" href="../css/admin-announcements.css">
</head>

<body>

<header class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2">
    <a href="./admin-dashboard.html" class="brand-link d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-icon">
            <i class="bi bi-universal-access"></i>
        </span>

        <span class="fw-bold fs-4">Wusool</span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">
    <div id="adminSidebarContainer"></div>

    <main class="main-content">
        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
                <p class="page-label mb-2">COMMUNICATION</p>
                <h1 class="display-6 fw-bold mb-2">Announcements</h1>
                <p class="text-secondary mb-0">Create scheduled messages for Users, Organizations, Visitors or everyone.</p>
            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">
            
<div class="row g-4">
    <div class="col-12 col-xl-5">
        <article class="content-card">
            <p class="page-label mb-1">CREATE ANNOUNCEMENT</p>
            <h2 class="h4 fw-bold mb-4">Audience Message</h2>

            <label class="form-label fw-semibold">Title</label>
            <input class="form-control mb-3" id="announcementTitle">

            <label class="form-label fw-semibold">Message</label>
            <textarea class="form-control mb-3" rows="4" id="announcementMessage"></textarea>

            <label class="form-label fw-semibold">Audience</label>
            <select class="form-select mb-3" id="announcementAudience">
                <option value="all">Everyone</option>
                <option value="user">Users</option>
                <option value="organization">Organizations</option>
                <option value="visitor">Visitors</option>
            </select>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label fw-semibold">Start</label>
                    <input type="datetime-local" class="form-control" id="announcementStart">
                </div>

                <div class="col-6">
                    <label class="form-label fw-semibold">End</label>
                    <input type="datetime-local" class="form-control" id="announcementEnd">
                </div>
            </div>

            <button class="btn btn-wusool w-100" id="publishAnnouncement">
                Publish Announcement
            </button>
        </article>
    </div>

    <div class="col-12 col-xl-7">
        <article class="content-card">
            <p class="page-label mb-1">PUBLISHED</p>
            <h2 class="h4 fw-bold mb-4">Announcement Schedule</h2>

            <div id="announcementsList"></div>
        </article>
    </div>
</div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/data-service.js"></script>
<script src="../../assets/version-service.js"></script>
<script src="../../assets/behavior-service.js"></script>
<script src="../js/admin-core.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script src="../js/admin-announcements.js"></script>
    <script src="../../assets/feature-store.js"></script>
    <script src="../../assets/error-runtime.js"></script>
    <script src="../../assets/maintenance-runtime.js"></script>
</body>
</html>
