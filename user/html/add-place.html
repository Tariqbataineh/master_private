  <body class="user-sidebar-layout">
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <header><nav class="navbar main-navbar"><div class="container"><a class="navbar-brand wusool-logo" href="./user-dashboard.html"><span class="logo-icon"><i class="bi bi-universal-access"></i></span> Wusool</a><a class="btn btn-wusool-outline" href="./explore-places.html">Explore Places</a></div></nav></header>
    <main id="mainContent">
      <section class="page-hero py-5"><div class="container"><span class="section-label">COMMUNITY CONTRIBUTION</span><h1 class="display-5 fw-bold mt-2">Suggest a New Place</h1><p class="lead text-secondary mb-0">Submit a place that should be reviewed and added to Wusool.</p></div></section>
      <section class="py-5"><div class="container"><form class="content-card p-4 p-md-5 mx-auto" id="addPlaceForm" style="max-width: 900px"><div class="row g-4"><div class="col-12 col-md-6"><label class="form-label fw-semibold" for="placeName">Place Name</label><input class="form-control" id="placeName" name="placeName" required /></div><div class="col-12 col-md-6"><label class="form-label fw-semibold" for="placeType">Place Type</label><select class="form-select" id="placeType" name="placeType" required><option value="">Choose...</option><option>Government</option><option>Healthcare</option><option>Bank</option><option>Education</option><option>Shopping</option><option>Other</option></select></div><div class="col-12 col-md-6"><label class="form-label fw-semibold" for="city">City</label><input class="form-control" id="city" name="city" required /></div><div class="col-12 col-md-6"><label class="form-label fw-semibold" for="address">Address</label><input class="form-control" id="address" name="address" required /></div><div class="col-12"><label class="form-label fw-semibold" for="accessibilityNotes">Accessibility Notes</label><textarea class="form-control" id="accessibilityNotes" name="accessibilityNotes" rows="4" placeholder="Tell us what you know about entrances, parking, elevators, or obstacles."></textarea></div></div><div class="alert alert-success d-none mt-4" id="placeStatus" role="status"></div><button class="btn btn-wusool btn-lg mt-4" type="submit">Submit for Review</button></form></div></section>
    </main>
