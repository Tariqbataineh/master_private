<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Settings | Wusool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" /><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" /><link rel="stylesheet" href="../../assets/site.css" /><link rel="stylesheet" href="../css/utility-pages.css" />
    <link rel="stylesheet" href="../css/user-layout.css">
</head>
  <body class="user-sidebar-layout">
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <header><nav class="navbar main-navbar"><div class="container"><a class="navbar-brand wusool-logo" href="./user-dashboard.html"><span class="logo-icon"><i class="bi bi-universal-access"></i></span> Wusool</a><a class="btn btn-wusool-outline" href="./user-profile.html">Back to Profile</a></div></nav></header>
    <main id="mainContent">
      <section class="page-hero py-5"><div class="container"><span class="section-label">YOUR ACCOUNT</span><h1 class="display-5 fw-bold mt-2">Account Settings</h1><p class="lead text-secondary mb-0">Manage your basic account and communication settings.</p></div></section>
      <section class="py-5"><div class="container"><form class="content-card p-4 p-md-5 mx-auto" id="accountSettingsForm" style="max-width: 850px"><div class="row g-4"><div class="col-12"><label class="form-label fw-semibold" for="fullName">Full Name</label><input class="form-control form-control-lg" id="fullName" name="fullName" required /></div><div class="col-12"><label class="form-label fw-semibold" for="email">Email Address</label><input class="form-control form-control-lg" id="email" name="email" type="email" required /></div><div class="col-12 col-md-6"><label class="form-label fw-semibold" for="language">Language</label><select class="form-select form-select-lg" id="language" name="language"><option value="en">English</option><option value="ar">Arabic</option></select></div><div class="col-12 col-md-6 d-flex align-items-end"><div class="form-check form-switch mb-2"><input class="form-check-input" id="emailNotifications" name="emailNotifications" type="checkbox" value="enabled" checked /><label class="form-check-label" for="emailNotifications">Email notifications</label></div></div></div><div class="alert alert-success d-none mt-4" id="settingsStatus" role="status"></div><button class="btn btn-wusool btn-lg mt-4" type="submit">Save Settings</button></form></div></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../../assets/site.js"></script><script src="../js/utility-pages.js"></script>
    <script src="../js/user-layout.js"></script>
</body>
</html>
