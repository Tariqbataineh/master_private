<body>

    <main class="admin-login-page">
        <section class="login-card">
            <div class="text-center mb-4">
                <span class="brand-icon">
                    <i class="bi bi-universal-access"></i>
                </span>

                <h1 class="h3 fw-bold mt-3 mb-1">Wusool</h1>
                <p class="page-label mb-2">ADMIN PORTAL</p>
                <h2 class="h4 fw-bold mb-2">Welcome Back</h2>

                <p class="text-secondary mb-0">
                    Sign in to manage the Wusool platform.
                </p>
            </div>

            <form id="adminLoginForm" novalidate>
                <div class="mb-3">
                    <label for="adminEmail" class="form-label fw-semibold">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="adminEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <div class="invalid-feedback">
                        Please enter a valid email address.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="adminPassword" class="form-label fw-semibold">
                        Password
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="adminPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            class="btn password-toggle"
                            type="button"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            <i class="bi bi-eye" id="passwordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="alert alert-danger d-none" id="loginError" role="alert"></div>

                <button
                    type="submit"
                    class="btn btn-wusool w-100"
                    id="loginButton"
                >
                    <span id="loginButtonText">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Sign In
                    </span>

                    <span class="d-none" id="loginLoading">
                        <span class="spinner-border spinner-border-sm me-2"></span>
                        Signing in...
                    </span>
                </button>
            </form>
        </section>
    </main>

    <script src="../js/admin-login.js"></script>
    
    
    
    <script src="../../assets/behavior-runtime.js"></script>
    
    <script src="../../assets/error-runtime.js"></script>
    <script src="../../assets/maintenance-runtime.js"></script>
</body>
