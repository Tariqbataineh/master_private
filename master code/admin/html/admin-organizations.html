<body>

<header
    class="mobile-header d-lg-none d-flex align-items-center justify-content-between px-3 py-2"
>
    <a
        href="./admin-dashboard.html"
        class="brand-link d-flex align-items-center gap-2 text-decoration-none"
    >
        <span class="brand-icon">
            <i class="bi bi-universal-access"></i>
        </span>

        <span class="fw-bold fs-4">
            Wusool
        </span>
    </a>

    <button
        class="btn btn-outline-light"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#adminSidebar"
        aria-controls="adminSidebar"
    >
        <i class="bi bi-list fs-4"></i>
    </button>
</header>

<div class="admin-layout">

    <div id="adminSidebarContainer"></div>

    <main class="main-content">

        <header class="page-header border-bottom">
            <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">

                <div
                    class="d-flex flex-column flex-xl-row justify-content-between align-items-xl-end gap-3"
                >
                    <div>
                        <p class="page-label mb-2">
                            MANAGEMENT
                        </p>

                        <h1 class="display-6 fw-bold mb-2">
                            Organizations
                        </h1>

                        <p class="text-secondary mb-0">
                            Create, edit, approve, suspend and manage organizations from one shared data source.
                        </p>
                    </div>

                    <button
                        type="button"
                        class="btn btn-wusool"
                        id="addOrganizationButton"
                    >
                        <i class="bi bi-plus-lg me-2"></i>
                        Add Organization
                    </button>
                </div>

            </div>
        </header>

        <div class="container-fluid px-3 px-md-4 px-xl-5 py-4">

            <section class="row g-3 mb-4" id="organizationStats"></section>

            <article class="content-card">

                <div class="toolbar mb-4">

                    <div class="d-flex flex-wrap gap-2">

                        <input
                            type="search"
                            class="form-control search-box"
                            id="organizationSearch"
                            placeholder="Search organizations..."
                        >

                        <select
                            class="form-select filter-select"
                            id="organizationStatusFilter"
                        >
                            <option value="">
                                All Statuses
                            </option>

                            <option value="active">
                                Active
                            </option>

                            <option value="pending">
                                Pending
                            </option>

                            <option value="suspended">
                                Suspended
                            </option>

                            <option value="rejected">
                                Rejected
                            </option>
                        </select>
                    </div>

                    <span
                        class="text-secondary"
                        id="organizationCount"
                    ></span>

                </div>

                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Organization</th>
                                <th>Type</th>
                                <th>City</th>
                                <th>Status</th>
                                <th>Branches</th>
                                <th>Updated</th>
                                <th class="text-end">
                                    Actions
                                </th>
                            </tr>
                        </thead>

                        <tbody id="organizationsTableBody"></tbody>
                    </table>
                </div>

            </article>

        </div>

    </main>
</div>


<!-- Add / Edit Modal -->
<div
    class="modal fade"
    id="organizationModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <p class="page-label mb-1">
                        ORGANIZATION
                    </p>

                    <h2
                        class="modal-title h4 fw-bold"
                        id="organizationModalTitle"
                    >
                        Add Organization
                    </h2>
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>

            <form id="organizationForm">

                <div class="modal-body">
<div class="alert alert-danger" data-account-error role="alert" hidden></div>

                    <input
                        type="hidden"
                        id="organizationId"
                    >

                    <div class="row g-3">

                        <div class="col-12 col-md-8">
                            <label
                                class="form-label fw-semibold"
                                for="organizationName"
                            >
                                Organization Name
                            </label>

                            <input
                                class="form-control"
                                id="organizationName"
                               
                             required minlength="2" maxlength="120">
                        </div>

                        <div class="col-12 col-md-4">
                            <label
                                class="form-label fw-semibold"
                                for="organizationType"
                            >
                                Type
                            </label>

                            <select
                                class="form-select"
                                id="organizationType"
                            >
                                <option>Bank</option>
                                <option>Government</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label
                                class="form-label fw-semibold"
                                for="organizationEmail"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="organizationEmail"
                             required maxlength="254">
                        </div>

                        <div class="col-12 col-md-6">
                            <label
                                class="form-label fw-semibold"
                                for="organizationPhone"
                            >
                                Phone
                            </label>

                            <input
                                class="form-control"
                                id="organizationPhone"
                             required maxlength="24">
                        </div>

                        <div class="col-12 col-md-6">
                            <label
                                class="form-label fw-semibold"
                                for="organizationCity"
                            >
                                City
                            </label>

                            <input
                                class="form-control"
                                id="organizationCity"
                                value="Amman"
                             required minlength="2" maxlength="80">
                        </div>

                        <div class="col-12 col-md-6">
                            <label
                                class="form-label fw-semibold"
                                for="organizationStatus"
                            >
                                Status
                            </label>

                            <select
                                class="form-select"
                                id="organizationStatus"
                            >
                                <option value="active">
                                    Active
                                </option>

                                <option value="pending">
                                    Pending
                                </option>

                                <option value="suspended">
                                    Suspended
                                </option>

                                <option value="rejected">
                                    Rejected
                                </option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label
                                class="form-label fw-semibold"
                                for="organizationAddress"
                            >
                                Address
                            </label>

                            <input
                                class="form-control"
                                id="organizationAddress"
                             required minlength="3" maxlength="250">
                        </div>

                        <div class="col-12">
                            <label
                                class="form-label fw-semibold"
                                for="organizationWebsite"
                            >
                                Website
                            </label>

                            <input
                                class="form-control"
                                id="organizationWebsite"
                             maxlength="250">
                        </div>

                        <div class="col-12">
                            <label
                                class="form-label fw-semibold"
                                for="organizationNotes"
                            >
                                Admin Notes
                            </label>

                            <textarea
                                class="form-control"
                                rows="4"
                                id="organizationNotes"
                             maxlength="1000"></textarea>
                        </div>

                    </div>

                </div>

                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="saveOrganizationButton"
                        class="btn btn-wusool"
                    >
                        Create Organization
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>


<!-- Details Modal -->
<div
    class="modal fade"
    id="organizationDetailsModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <p class="page-label mb-1">
                        360° VIEW
                    </p>

                    <h2
                        class="modal-title h4 fw-bold"
                        id="organizationDetailsTitle"
                    ></h2>
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>
            </div>

            <div
                class="modal-body"
                id="organizationDetailsContent"
            ></div>

        </div>
    </div>
</div>

</body>
</html>
