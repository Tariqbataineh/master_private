<body data-wu-recruitment="true">

    <!-- Shared Organization Sidebar -->
    <div id="organizationSidebarContainer"></div>

    <!-- Topbar -->
    <header class="organization-topbar">

        <button
            type="button"
            id="sidebarToggleButton"
            class="sidebar-toggle-button"
            aria-label="Open navigation"
            aria-expanded="false"
        >
            <i class="bi bi-list"></i>
        </button>

        <div class="topbar-title">
            <span>
                Organization Admin
            </span>
        </div>

        <div class="topbar-actions">

            <a
                href="./notifications.html"
                class="notification-button"
                aria-label="Open notifications"
            >
                <i class="bi bi-bell"></i>

                <span
                    id="topbarNotificationCount"
                    class="notification-count"
                >
                    4
                </span>
            </a>

            <div class="dropdown">

                <button
                    type="button"
                    class="profile-button dropdown-toggle"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                >
                    <span id="topbarOrganizationInitials">
                        OR
                    </span>

                    <span
                        id="topbarOrganizationName"
                        class="d-none d-md-inline"
                    >
                        Organization
                    </span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a
                            class="dropdown-item"
                            href="./organization-settings.html#manager-profile"
                        >
                            <i class="bi bi-building-gear"></i>
                            Organization Profile
                        </a>
                    </li>

                    <li>
                        <a
                            class="dropdown-item"
                            href="./organization-settings.html"
                        >
                            <i class="bi bi-gear"></i>
                            Account Settings
                        </a>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <button
                            type="button"
                            id="dropdownLogoutButton"
                            class="dropdown-item text-danger"
                        >
                            <i class="bi bi-box-arrow-left"></i>
                            Log Out
                        </button>
                    </li>

                </ul>

            </div>

        </div>

    </header>

    <!-- Main Content -->
    <main
        class="organization-main"
        id="mainContent"
    >
        <section
            id="recruitmentRoot"
            class="recruitment-shell"
            aria-busy="true"
        >
            <p role="status">
                Loading recruitment…
            </p>
        </section>
    </main>

    <!-- Bootstrap JavaScript -->
    <script
        src="../../assets/vendor/bootstrap-5.3.3/bootstrap.bundle.min.js"
    ></script>

    <script src="../js/organization-sidebar.js"></script>
