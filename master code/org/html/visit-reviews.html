<body class="visit-reviews-page">
<a href="#mainContent" class="visually-hidden-focusable">Skip to reviews</a>
<div id="organizationSidebarContainer"></div>
<main id="mainContent" class="organization-main-content reviews-workspace">
<header class="reviews-header"><div><p class="page-label">VISITOR EXPERIENCE</p><h1>Visit Reviews</h1><p class="text-secondary">Verified feedback from completed visits to your branches. Admin approval locks the visitor's review.</p></div><button id="openSidebarButton" type="button" class="btn btn-outline-primary d-lg-none" aria-label="Open navigation"><i class="bi bi-list"></i></button></header>
<section class="reviews-metrics" aria-label="Review statistics" aria-live="polite"><article><span>Total reviews</span><strong id="reviewsTotal">0</strong></article><article><span>Approved rating</span><strong id="reviewsAverage">—</strong></article><article><span>Approved</span><strong id="reviewsApproved">0</strong></article><article><span>Pending review</span><strong id="reviewsPending">0</strong></article></section>
<section class="reviews-filters" aria-label="Filter reviews"><label>Search<input id="reviewSearch" class="form-control" type="search" maxlength="200" placeholder="Visitor, branch or comment"></label><label>Branch<select id="reviewBranchFilter" class="form-select"><option value="">All branches</option></select></label><label>Status<select id="reviewStatusFilter" class="form-select"><option value="">All statuses</option><option value="Visible">Approved</option><option value="Pending">Pending</option><option value="Rejected">Rejected</option><option value="Hidden">Hidden</option></select></label><label>Rating<select id="reviewRatingFilter" class="form-select"><option value="">All ratings</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></label></section>
<p id="reviewResults" class="text-secondary small" role="status" aria-live="polite"></p><section id="visitReviewsGrid" class="visit-reviews-grid" aria-label="Visitor reviews"></section><p id="reviewEmpty" class="review-empty" hidden>No reviews yet. Reviews appear after a visitor completes a visit and submits feedback.</p>
</main>
